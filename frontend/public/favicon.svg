  <polyline points="12,45 25,32 35,39 49,19"
            fill="none" stroke="#22c55e" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 17 L53 15 L51 28 Z" fill="#22c55e"/>
</svg>
