    <path d="M20.5 5.5h4.2a1.8 1.8 0 0 1 1.8 1.8v4.2" fill="none"/>
    <path d="M26.5 20.5v4.2a1.8 1.8 0 0 1-1.8 1.8h-4.2" fill="none"/>
    <path d="M11.5 26.5H7.3a1.8 1.8 0 0 1-1.8-1.8v-4.2" fill="none"/>
  </g>
  <path d="M9 20.5 12 16.6l2.6 2.8 3-6.1 2.6 4.7 3.4-5.3"
        fill="none" stroke="#6f9ee8" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>
