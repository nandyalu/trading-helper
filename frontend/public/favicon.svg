<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Trading Helper">
  <!-- Kept deliberately coarse: this is read at 16px in a browser tab, where
       thin strokes and candlestick detail turn to mush. A single thick rising
       line on a dark tile stays legible against both light and dark tab bars. -->
