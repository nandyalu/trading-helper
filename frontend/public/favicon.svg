<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Same mark as app-logo: a path that moves inside a frame it never crosses.
       Colours are literal here because a favicon has no page to inherit from,
       and both are legible on a light or a dark browser chrome. -->
