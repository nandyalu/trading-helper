<!-- Icon sprite. Every icon in the app is one <use> of a symbol defined here,
     so the bundle carries each path once and the icons inherit text color. -->
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol
    id="i-grid"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect x="3" y="3" width="7.5" height="7.5" rx="1.5" />
    <rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5" />
    <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5" />
    <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5" />
  </symbol>
  <symbol
    id="i-list"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" />
  </symbol>
  <symbol
    id="i-activity"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M3 12.5h3.5l3-8 4 15 3-7H21" />
  </symbol>
  <symbol
    id="i-bell"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M18 8.5a6 6 0 1 0-12 0c0 6.5-2.5 8.5-2.5 8.5h17S18 15 18 8.5" />
    <path d="M13.7 20.5a2 2 0 0 1-3.4 0" />
  </symbol>
  <symbol
    id="i-briefcase"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect x="2.5" y="7" width="19" height="13.5" rx="2" />
    <path d="M8.5 7V5.5a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2V7M2.5 12.5h19" />
  </symbol>
  <symbol
    id="i-file"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
    <path d="M14 3v5h5M9 13h6M9 17h4" />
  </symbol>
  <symbol
    id="i-target"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <circle cx="12" cy="12" r="8.5" />
    <circle cx="12" cy="12" r="4.5" />
    <circle cx="12" cy="12" r="1" />
  </symbol>
  <symbol
    id="i-calendar"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect x="3" y="5" width="18" height="16" rx="2" />
    <path d="M3 10h18M8 3v4M16 3v4" />
  </symbol>
  <symbol
    id="i-compass"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <circle cx="12" cy="12" r="9" />
    <path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1z" />
  </symbol>
  <symbol
    id="i-sliders"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h9M19 18h1" />
    <circle cx="16" cy="6" r="2.2" />
    <circle cx="10" cy="12" r="2.2" />
    <circle cx="16" cy="18" r="2.2" />
  </symbol>
  <symbol
    id="i-book"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
  </symbol>
  <symbol
    id="i-menu"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M4 7h16M4 12h16M4 17h16" />
  </symbol>
  <symbol
    id="i-close"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M6 6l12 12M18 6L6 18" />
  </symbol>
  <symbol
    id="i-sun"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <circle cx="12" cy="12" r="4" />
    <path
      d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"
    />
  </symbol>
  <symbol
    id="i-moon"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M21 12.9A9 9 0 1 1 11.1 3a7 7 0 0 0 9.9 9.9z" />
  </symbol>
  <symbol
    id="i-chart"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />
  </symbol>
  <symbol
    id="i-zap"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z" />
  </symbol>
</svg>

<div class="shell">
  <aside class="sidebar" [class.open]="drawerOpen()">
    <a class="brand" routerLink="/">
      <span class="brand-mark" aria-hidden="true">
        <svg width="16" height="16"><use href="#i-chart" /></svg>
      </span>
      Trading Helper
    </a>

    <nav class="nav" aria-label="Main">
      @for (item of primaryNav; track item.path) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
        >
          <svg class="nav-icon" aria-hidden="true"><use [attr.href]="'#i-' + item.icon" /></svg>
          {{ item.label }}
        </a>
      }

      <div class="nav-group-label">The record</div>
      @for (item of recordNav; track item.path) {
        <a class="nav-link" [routerLink]="item.path" routerLinkActive="active">
          <svg class="nav-icon" aria-hidden="true"><use [attr.href]="'#i-' + item.icon" /></svg>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="sidebar-foot">
      <!-- Dropped on the published copy, where every write is refused anyway.
           A link to a page whose every control returns 403 is a dead end. -->
      @if (!isPublic()) {
        <a class="nav-link" routerLink="/settings" routerLinkActive="active">
          <svg class="nav-icon" aria-hidden="true"><use href="#i-sliders" /></svg>
          Settings
        </a>
      }
      <a class="nav-link" href="/docs">
        <svg class="nav-icon" aria-hidden="true"><use href="#i-book" /></svg>
        Docs
      </a>
      <button class="nav-link" type="button" (click)="toggleTheme()">
        <svg class="nav-icon" aria-hidden="true">
          <use [attr.href]="theme() === 'dark' ? '#i-sun' : '#i-moon'" />
        </svg>
        {{ theme() === 'dark' ? 'Light theme' : 'Dark theme' }}
      </button>
    </div>
  </aside>

  @if (drawerOpen()) {
    <button class="scrim" type="button" aria-label="Close menu" (click)="closeDrawer()"></button>
  }

  <div class="content">
    <header class="topbar">
      <button
        class="btn btn-ghost btn-icon"
        type="button"
        [attr.aria-expanded]="drawerOpen()"
        aria-label="Menu"
        (click)="toggleDrawer()"
      >
        <svg aria-hidden="true"><use [attr.href]="drawerOpen() ? '#i-close' : '#i-menu'" /></svg>
      </button>
      <span class="topbar-title">{{ currentLabel() }}</span>
      <span class="spacer"></span>
      <button
        class="btn btn-ghost btn-icon"
        type="button"
        [attr.aria-label]="theme() === 'dark' ? 'Use the light theme' : 'Use the dark theme'"
        (click)="toggleTheme()"
      >
        <svg aria-hidden="true">
          <use [attr.href]="theme() === 'dark' ? '#i-sun' : '#i-moon'" />
        </svg>
      </button>
    </header>

    <main>
      <router-outlet />
    </main>
  </div>

  <nav class="tabbar" aria-label="Sections">
    <div class="tabbar-inner">
      @for (item of tabNav; track item.path) {
        <a
          class="tab"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
        >
          <svg aria-hidden="true"><use [attr.href]="'#i-' + item.icon" /></svg>
          {{ item.label }}
        </a>
      }
      <button class="tab" type="button" (click)="toggleDrawer()">
        <svg aria-hidden="true"><use href="#i-menu" /></svg>
        More
      </button>
    </div>
  </nav>
</div>
