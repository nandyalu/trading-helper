<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trading Helper</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Signals, positions, and alerts for your watchlist." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Set the theme before the first paint. If Angular did it instead, a dark
       reader would see one white frame every time the app loads. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('th-theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {
          /* Private mode blocks localStorage. The media query still applies. */
        }
      })();
    </script>
  </head>
  <body>
    <app-root>
      <!-- Replaced when the app boots. Shown while the first bundle loads. -->
      <div class="boot">Loading Trading Helper…</div>
    </app-root>
  </body>
</html>
